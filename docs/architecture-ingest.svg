<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="260" fill="#ffffff"/>

  <!-- Row 1 -->
  <g>
    <rect x="20" y="30" width="130" height="50" rx="8" fill="#f3f4f6" stroke="#c7cad1"/>
    <text x="85" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#111">PDF upload</text>
    <text x="85" y="66" text-anchor="middle" font-size="11" fill="#555">Streamlit UI</text>
  </g>

  <line x1="150" y1="55" x2="185" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="185" y="20" width="160" height="70" rx="8" fill="#e6f1fb" stroke="#8fb8e0"/>
    <text x="265" y="45" text-anchor="middle" font-size="13" font-weight="600" fill="#0c447c">GROBID</text>
    <text x="265" y="62" text-anchor="middle" font-size="11" fill="#0c447c">consolidateHeader=1</text>
    <text x="265" y="77" text-anchor="middle" font-size="11" fill="#0c447c">(CrossRef lookup)</text>
  </g>

  <line x1="345" y1="55" x2="380" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="380" y="10" width="190" height="90" rx="8" fill="#f3f4f6" stroke="#c7cad1"/>
    <text x="475" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#111">Extract + validate</text>
    <text x="475" y="47" text-anchor="middle" font-size="11" fill="#555">title/authors/year/venue</text>
    <text x="475" y="62" text-anchor="middle" font-size="11" fill="#555">reject placeholder junk</text>
    <text x="475" y="77" text-anchor="middle" font-size="11" fill="#555">[[SECTION::heading]] markers</text>
    <text x="475" y="92" text-anchor="middle" font-size="11" fill="#555">in full_text</text>
  </g>

  <line x1="570" y1="55" x2="605" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="605" y="20" width="150" height="70" rx="8" fill="#e6f1fb" stroke="#8fb8e0"/>
    <text x="680" y="45" text-anchor="middle" font-size="13" font-weight="600" fill="#0c447c">Venue backfill</text>
    <text x="680" y="62" text-anchor="middle" font-size="11" fill="#0c447c">OpenAlex, by DOI</text>
    <text x="680" y="77" text-anchor="middle" font-size="11" fill="#0c447c">only if venue empty</text>
  </g>

  <line x1="755" y1="55" x2="790" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="790" y="20" width="90" height="70" rx="8" fill="#e7f6ec" stroke="#8fcf9f"/>
    <text x="835" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#1a7a3d">Embedding</text>
    <text x="835" y="66" text-anchor="middle" font-size="11" fill="#1a7a3d">cache built</text>
  </g>

  <!-- down to storage -->
  <line x1="835" y1="90" x2="835" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="100" x2="475" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="150" y="150" width="600" height="80" rx="10" fill="#fdf3e6" stroke="#e8c07f"/>
    <text x="450" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#8a5a00">library/ (git-committed)</text>
    <text x="450" y="192" text-anchor="middle" font-size="11" fill="#8a5a00">index.jsonl (metadata + full_text w/ section markers) · pdfs/ · embeddings/ (gitignored cache)</text>
    <text x="450" y="210" text-anchor="middle" font-size="11" fill="#8a5a00">append_to_library() auto-commits every ingest</text>
  </g>
</svg>
