<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="220" fill="#ffffff"/>

  <g fill="none" stroke="#000" stroke-width="1">
    <rect x="20" y="30" width="130" height="50" rx="3"/>
    <rect x="185" y="20" width="160" height="70" rx="3"/>
    <rect x="380" y="10" width="190" height="90" rx="3"/>
    <rect x="605" y="20" width="150" height="70" rx="3"/>
    <rect x="790" y="20" width="90" height="70" rx="3"/>
  </g>

  <g font-size="12.5" fill="#000">
    <text x="85" y="50" text-anchor="middle" font-weight="bold">PDF upload</text>
    <text x="85" y="66" text-anchor="middle" font-size="11">Streamlit UI</text>

    <text x="265" y="45" text-anchor="middle" font-weight="bold">GROBID</text>
    <text x="265" y="62" text-anchor="middle" font-size="11">consolidateHeader=1</text>
    <text x="265" y="77" text-anchor="middle" font-size="11">(CrossRef lookup)</text>

    <text x="475" y="30" text-anchor="middle" font-weight="bold">Extract, validate</text>
    <text x="475" y="47" text-anchor="middle" font-size="11">title / authors / year / venue</text>
    <text x="475" y="62" text-anchor="middle" font-size="11">reject placeholder junk</text>
    <text x="475" y="77" text-anchor="middle" font-size="11">[[SECTION::heading]] markers</text>
    <text x="475" y="92" text-anchor="middle" font-size="11">in full_text</text>

    <text x="680" y="45" text-anchor="middle" font-weight="bold">Venue backfill</text>
    <text x="680" y="62" text-anchor="middle" font-size="11">OpenAlex, by DOI</text>
    <text x="680" y="77" text-anchor="middle" font-size="11">only if venue empty</text>

    <text x="835" y="50" text-anchor="middle" font-weight="bold">Embedding</text>
    <text x="835" y="66" text-anchor="middle" font-size="11">cache built</text>
  </g>

  <line x1="150" y1="55" x2="185" y2="55" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="345" y1="55" x2="380" y2="55" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="570" y1="55" x2="605" y2="55" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="755" y1="55" x2="790" y2="55" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>

  <line x1="835" y1="90" x2="835" y2="140" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="475" y1="100" x2="475" y2="140" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="150" y="140" width="600" height="70" rx="3" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="450" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000">library/ (git-tracked)</text>
  <text x="450" y="180" text-anchor="middle" font-size="11" fill="#000">index.jsonl (metadata + full_text with section markers) · pdfs/ · embeddings/ (gitignored cache)</text>
  <text x="450" y="196" text-anchor="middle" font-size="11" fill="#000">append_to_library() auto-commits every ingest</text>
</svg>
