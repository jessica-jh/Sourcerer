<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="230" fill="#ffffff"/>

  <g fill="none" stroke="#000" stroke-width="1">
    <rect x="20" y="20" width="140" height="70" rx="3"/>
    <rect x="195" y="10" width="160" height="90" rx="3"/>
    <rect x="390" y="10" width="160" height="90" rx="3"/>
    <rect x="585" y="10" width="160" height="90" rx="3"/>
    <rect x="780" y="10" width="100" height="90" rx="3"/>
  </g>

  <g font-size="12.5" fill="#000">
    <text x="90" y="45" text-anchor="middle" font-weight="bold">Claim sentence</text>
    <text x="90" y="62" text-anchor="middle" font-size="11">typed in Search tab</text>

    <text x="275" y="35" text-anchor="middle" font-weight="bold">Embedding pre-rank</text>
    <text x="275" y="53" text-anchor="middle" font-size="11">bi-encoder, cosine sim.</text>
    <text x="275" y="68" text-anchor="middle" font-size="11">over cached sentence</text>
    <text x="275" y="83" text-anchor="middle" font-size="11">embeddings (all papers)</text>

    <text x="470" y="35" text-anchor="middle" font-weight="bold">Cross-encoder rerank</text>
    <text x="470" y="53" text-anchor="middle" font-size="11">joint attention over</text>
    <text x="470" y="68" text-anchor="middle" font-size="11">(claim, evidence) pairs</text>
    <text x="470" y="83" text-anchor="middle" font-size="11">top 30 candidates</text>

    <text x="665" y="35" text-anchor="middle" font-weight="bold">LLM judge</text>
    <text x="665" y="53" text-anchor="middle" font-size="11">gpt-4o-mini scores</text>
    <text x="665" y="68" text-anchor="middle" font-size="11">1-5 relevance,</text>
    <text x="665" y="83" text-anchor="middle" font-size="11">short rationale</text>

    <text x="830" y="35" text-anchor="middle" font-weight="bold">Results</text>
    <text x="830" y="53" text-anchor="middle" font-size="11">score, evidence,</text>
    <text x="830" y="68" text-anchor="middle" font-size="11">citation string</text>
  </g>

  <line x1="160" y1="55" x2="195" y2="55" stroke="#000" stroke-width="1" marker-end="url(#arrow2)"/>
  <line x1="355" y1="55" x2="390" y2="55" stroke="#000" stroke-width="1" marker-end="url(#arrow2)"/>
  <line x1="550" y1="55" x2="585" y2="55" stroke="#000" stroke-width="1" marker-end="url(#arrow2)"/>
  <line x1="745" y1="55" x2="780" y2="55" stroke="#000" stroke-width="1" marker-end="url(#arrow2)"/>

  <line x1="830" y1="100" x2="830" y2="150" stroke="#000" stroke-width="1" marker-end="url(#arrow2)"/>

  <rect x="380" y="150" width="500" height="70" rx="3" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="630" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000">Provenance annotations on each evidence sentence</text>
  <text x="630" y="190" text-anchor="middle" font-size="11" fill="#000">section it came from (Introduction/Lit. Review vs. Results/Discussion), plus a</text>
  <text x="630" y="205" text-anchor="middle" font-size="11" fill="#000">regex flag if the sentence itself cites another source. Both read off the paper's own text, no extra LLM call.</text>
</svg>
