<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="260" fill="#ffffff"/>

  <g>
    <rect x="20" y="20" width="140" height="70" rx="8" fill="#f3f4f6" stroke="#c7cad1"/>
    <text x="90" y="45" text-anchor="middle" font-size="13" font-weight="600" fill="#111">Claim sentence</text>
    <text x="90" y="62" text-anchor="middle" font-size="11" fill="#555">typed in Search tab</text>
  </g>

  <line x1="160" y1="55" x2="195" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <g>
    <rect x="195" y="10" width="160" height="90" rx="8" fill="#e6f1fb" stroke="#8fb8e0"/>
    <text x="275" y="35" text-anchor="middle" font-size="13" font-weight="600" fill="#0c447c">Embedding pre-rank</text>
    <text x="275" y="53" text-anchor="middle" font-size="11" fill="#0c447c">bi-encoder, cosine sim.</text>
    <text x="275" y="68" text-anchor="middle" font-size="11" fill="#0c447c">over cached sentence</text>
    <text x="275" y="83" text-anchor="middle" font-size="11" fill="#0c447c">embeddings (all papers)</text>
  </g>

  <line x1="355" y1="55" x2="390" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <g>
    <rect x="390" y="10" width="160" height="90" rx="8" fill="#f3e8fb" stroke="#c69fe0"/>
    <text x="470" y="35" text-anchor="middle" font-size="13" font-weight="600" fill="#6b2c91">Cross-encoder rerank</text>
    <text x="470" y="53" text-anchor="middle" font-size="11" fill="#6b2c91">joint attention over</text>
    <text x="470" y="68" text-anchor="middle" font-size="11" fill="#6b2c91">(claim, evidence) pairs</text>
    <text x="470" y="83" text-anchor="middle" font-size="11" fill="#6b2c91">top 30 candidates</text>
  </g>

  <line x1="550" y1="55" x2="585" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <g>
    <rect x="585" y="10" width="160" height="90" rx="8" fill="#fdeaea" stroke="#e5a3a3"/>
    <text x="665" y="35" text-anchor="middle" font-size="13" font-weight="600" fill="#a23b3b">LLM judge</text>
    <text x="665" y="53" text-anchor="middle" font-size="11" fill="#a23b3b">gpt-4o-mini scores</text>
    <text x="665" y="68" text-anchor="middle" font-size="11" fill="#a23b3b">1-5 relevance +</text>
    <text x="665" y="83" text-anchor="middle" font-size="11" fill="#a23b3b">short rationale</text>
  </g>

  <line x1="745" y1="55" x2="780" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <g>
    <rect x="780" y="10" width="100" height="90" rx="8" fill="#e7f6ec" stroke="#8fcf9f"/>
    <text x="830" y="35" text-anchor="middle" font-size="13" font-weight="600" fill="#1a7a3d">Results</text>
    <text x="830" y="53" text-anchor="middle" font-size="11" fill="#1a7a3d">score + evidence</text>
    <text x="830" y="68" text-anchor="middle" font-size="11" fill="#1a7a3d">+ citation string</text>
  </g>

  <line x1="830" y1="100" x2="830" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <g>
    <rect x="400" y="150" width="480" height="90" rx="10" fill="#fdf3e6" stroke="#e8c07f"/>
    <text x="640" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#8a5a00">Provenance annotations on each evidence sentence</text>
    <text x="640" y="193" text-anchor="middle" font-size="11" fill="#8a5a00">📚 / ✅ which section it came from (Introduction/Lit. Review vs. Results/Discussion)</text>
    <text x="640" y="210" text-anchor="middle" font-size="11" fill="#8a5a00">⚠️ regex flag: sentence itself cites another source (re-citation risk)</text>
    <text x="640" y="227" text-anchor="middle" font-size="11" fill="#8a5a00">— both computed from the paper's own text, no extra LLM call</text>
  </g>
</svg>
